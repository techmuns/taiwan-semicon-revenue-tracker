name = "taiwan-semicon-revenue"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# WHICH ACCOUNT THIS DEPLOYS TO, STATED RATHER THAN INHERITED.
#
# Without this line the target account comes from whatever CLOUDFLARE_ACCOUNT_ID
# (or the deprecated CF_ACCOUNT_ID) happens to be in the shell - so a machine
# holding credentials for a different account would not fail. It would succeed,
# creating a SECOND Worker of the same name at a different *.workers.dev
# hostname, bound to a database_id that account cannot read. The live dashboard
# would go on serving stale code while the deploy reported success.
#
# That is not hypothetical: a session with a token for an unrelated account got
# as far as the deploy step before `wrangler deployments list` returned
#   ✘ This Worker does not exist on your account. [code: 10007]
# which is exactly the check this line makes unnecessary. Pinned, a wrong-account
# deploy fails loudly on an authentication error instead of quietly succeeding.
#
# This is the account behind taiwan-semicon-revenue.tech-441.workers.dev. An
# account ID is not a secret - it is in every dashboard URL - so it belongs in
# version control, unlike the API token, which belongs in `wrangler secret` or
# the environment.
account_id = "a441977d2344922f96303859b74754d8"

# Structured logs + traces in the dashboard. Cheap, and the monthly cron is
# exactly the kind of thing you only debug after the fact.
[observability]
enabled = true

# NO [[d1_databases]] BLOCK, DELIBERATELY.
#
# The dashboard left Cloudflare D1 on 2026-09-01, after D1's free-tier DAILY ROW
# READ LIMIT was exceeded and every data endpoint began returning
#
#   D1_ERROR: Your account has exceeded D1's free tier daily row read limit.
#
# while /api/health went on reporting ok:true. The runbook had estimated ~2,600
# page loads before that cap; whatever the real number was, it was reachable.
#
# Nothing about the data needed a hosted database. D1 IS Cloudflare's hosted
# SQLite, and the analytics views, the migrations and the bucket-heatmap
# statement all run unchanged against a plain SQLite file - which
# ingest/tests/test_heatmap_sql.py had been doing in CI since the day it was
# written. So the pipeline now builds that file on GitHub Actions, runs the same
# SQL against it at publish time, and ships the answers as static JSON. There is
# no database in the request path at all, and therefore no read limit to exceed.
#
# The store of record is data/pipeline.sqlite, built from worker/migrations/*.sql
# by ingest/src/twrev/store.py. Those migrations are still the schema; they are
# just applied to a file instead of to a Cloudflare service.

# NO [triggers] BLOCK, DELIBERATELY.
#
# `crons = ["0 1 11,14,18 * *"]` used to sit here and never registered once: the
# account is at the Workers Free ceiling of five cron triggers PER ACCOUNT, so
# every deploy ended in `code: 10072`. The error was expected and therefore
# indistinguishable from a real one, which is its own cost - deploys are clean
# again now.
#
# The refresh runs on GitHub Actions instead (.github/workflows/refresh.yml),
# on the same 11/14/18 cadence, and writes to this same D1 database through the
# API. D1 is untouched by that move and stays the store of record; only the
# schedule left Cloudflare.
#
# Re-adding a trigger here would fail the same way, and would double-run the
# refresh if the account ever freed a slot.

# The dashboard, built by `npm run build` in web/ straight into public/.
#
# `not_found_handling` is deliberately left at its default of "none". Setting it
# to "single-page-application" makes the asset server answer every unmatched
# path itself, which would swallow /api/* before the Worker ever runs. The SPA
# fallback is therefore done in src/index.ts, which knows which paths are API
# routes and which are client-side ones.
[assets]
directory = "public"
binding = "ASSETS"
# The published data must go through the access gate, and assets are otherwise
# served BEFORE the Worker runs - so without this, /data/*.json would be
# readable without a credential while /api/* had required one. That is a
# regression the migration must not introduce silently: it is invisible today
# only because the deployment is in `open` mode, and would become a live leak
# the moment DASHBOARD_KEY is set.
run_worker_first = ["/data/*"]
