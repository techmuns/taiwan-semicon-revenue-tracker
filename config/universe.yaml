# Taiwan semiconductor supply-chain revenue tracker - ticker universe.
#
# This file is the single source of truth for bucket, tier and lifecycle.
# It is loaded by the Python ingest and mirrored into the D1 `universe` table,
# so the scraper, the API and the dashboard all read the same values.
#
# Editing rules:
#   - `ticker` MUST be quoted. Unquoted 2330 becomes an int and silently breaks joins.
#   - `market_hint` is a HINT ONLY. Resolution is "whichever source actually has the
#     row", so a TPEx -> TWSE transfer needs no edit here; it raises MARKET_CHANGED.
#   - To retire a name, set `status` and `active_to`. Never delete the entry - that
#     would drop its history from the output.
#   - `name_zh` is the as-of-2026-08 reported name, used only for display convenience.
#     The authoritative per-month reported name lives in raw_revenue.company_name.
#
# Verified 2026-08-21 against openapi.twse.com.tw t187ap05_L and
# tpex.org.tw mopsfin_t187ap05_O.

