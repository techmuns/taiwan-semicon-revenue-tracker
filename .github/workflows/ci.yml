# Checks that run on every push. There were none before this file.
#
# The monthly refresh (refresh.yml) is the only workflow this repo had, and it
# runs three days a month against live MOPS - so a change that broke the parser,
# the analytics view or the dashboard build would sit undetected until the 11th,
# and would then fail in the one job whose purpose is writing that month's data
# to production. That is the worst possible place to discover it.
#
# Everything here is OFFLINE. `TWREV_OFFLINE=1` makes the fetcher raise on a
# cache miss, so no check in this file can pass because MOPS happened to be up
# or fail because it happened to be down.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first: nobody needs the check results for a
# commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - name: Install
        run: pip install -r ingest/requirements.txt

      # The suite builds the real SQLite schema from worker/migrations/*.sql and
      # runs the analytics view against it, so a migration that breaks the
      # twelve-column contract fails here rather than inside the monthly refresh.
      - name: Tests
        working-directory: ingest
        run: python -m pytest -q

      # `validate` re-reads every hand-edited YAML and asserts the TypeScript
      # generated from it is current. The generated files are committed - they
      # have to be, the browser imports them - so the failure mode this catches
      # is a config edit whose regeneration was forgotten, which would leave the
      # page and the config disagreeing about a number that is on screen.
      - name: Config and generated files
        env:
          PYTHONPATH: ingest/src
        run: python -m twrev.cli validate

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            worker/package-lock.json

      - name: Install (web)
        run: npm --prefix web ci
      # `npm run build` is theme parity + tsc + vite, in that order, so this one
      # command is the whole front-end gate. Running tsc separately as well would
      # only duplicate it.
      - name: Build (web)
        run: npm --prefix web run build

      - name: Install (worker)
        run: npm --prefix worker ci
      - name: Typecheck (worker)
        run: npm --prefix worker run typecheck
