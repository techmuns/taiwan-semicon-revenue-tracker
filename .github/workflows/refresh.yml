# Monthly revenue refresh.
#
# THE SCHEDULE MOVED TO GITHUB; THE DATABASE DID NOT.
#
# D1 is still the store of record and the Worker still answers every endpoint
# out of it. What moved here is deciding when to run and doing the scraping,
# because the Cloudflare account sits at the Workers Free ceiling of five cron
# triggers per account - `wrangler deploy` reported `code: 10072`, the Worker's
# scheduled handler was never registered, and not one refresh ever fired.
#
# D1's own limits were never close to the problem, and it is worth writing the
# numbers down so nobody re-litigates this later. Measured against the real
# store: one run writes about 100 rows against an allowance of 100,000 a day
# (0.3% of a single day's budget, per month); a dashboard page load reads about
# 1,900 rows against 5,000,000 a day, roughly 2,600 page loads before the cap;
# storage is 200 KB of 5 GB. What was exhausted was a quota on scheduled jobs.
#
# Actions is also the better host for the scrape on its merits. The Worker had a
# subrequest budget, which is why its repair path fetched MOPS for tier-1 names
# only. A runner has none, so this reads all 36 trackable names from MOPS *and*
# the OpenAPI feeds - which is what finally gives the cross-source check two
# independent renderings of one filing to compare. Under the Worker no
# company-month was ever carried by two sources, so that check had nothing to do.

name: refresh

on:
  # Taiwan requires monthly revenue disclosure by the 10th. Three passes catch
  # the late filers without hammering MOPS: the same 11/14/18 cadence the
  # Worker's trigger declared but never got to run.
  schedule:
    - cron: "0 1 11,14,18 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to refresh (YYYY-MM). Blank = latest due by the 10th."
        required: false
        type: string
      dry_run:
        description: "Scrape and validate, but publish nothing"
        required: false
        type: boolean
        default: false

# Two runs committing state to the same branch concurrently is the one way this
# can corrupt anything, so they queue instead.
concurrency:
  group: refresh
  cancel-in-progress: false

# The data lives in this repository now, so the job writes to it: the durable
# JSONL state and the published JSON the dashboard reads.
#
# NOTE WHAT IS *NOT* HERE: any Cloudflare credential. Publishing the files to
# readers means a `wrangler deploy`, and doing that from this job would mean
# handing an unattended scheduled scrape the power to replace the entire Worker,
# including the access gate - a strictly larger permission than the D1-edit
# token it replaces. So this job commits, and then asks deploy.yml to publish.
# deploy.yml holds the Cloudflare token; refresh.yml never sees it.
permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 36 companies at a 3s throttle is ~2 minutes; 30 leaves room for retries
    # and a slow MOPS without letting a hung run burn the month's minutes.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - name: Install
        run: pip install -r ingest/requirements.txt

      # Fail here, loudly, rather than 20 minutes later inside wrangler with an
      # authentication error that reads like a Cloudflare outage. The token must
      # come from the account that owns the Worker (a441977d...), not from any
      # other account the operator happens to be logged into - we have already
      # been bitten once by a token pointing somewhere else.
      # The scrape cache is the audit artifact - the bytes MOPS actually served.
      # Restoring it makes a same-month re-run free and instant, which matters
      # because the most common reason to re-run is a transient failure on two
      # or three companies out of thirty-six.
      - name: Restore scrape cache
        uses: actions/cache@v4
        with:
          path: ingest/cache
          key: mops-cache-${{ github.run_id }}
          restore-keys: mops-cache-

      # The dispatch inputs arrive as environment variables and are branched on
      # in shell rather than interpolated into the command line. `${{ inputs.* }}`
      # is only defined for workflow_dispatch and this workflow also has a
      # `schedule` trigger; referencing a context that does not exist under one
      # of a workflow's triggers is a startup failure, which reports no job and
      # no log and is near-undebuggable. Run 1 died exactly that way.
      #
      # The SQLite file is the STORE OF RECORD now, not a scratch validator.
      # It is rebuilt from data/raw/*.jsonl at the start of the run - which is
      # what carries every prior month, and without which the store would hold
      # one month and every year-on-year figure in the export would be null -
      # then this month's rows go in, the analytics view is executed and its
      # twelve-column contract asserted, and the golden checks run over the
      # WHOLE store, not just the new rows.
      #
      # The state is written back only AFTER those gates pass, so a bad run
      # cannot overwrite good state.
      - name: Scrape, validate and update the store
        env:
          PYTHONPATH: ingest/src
          MONTH: ${{ github.event.inputs.month }}
        run: |
          args=(--db data/pipeline.sqlite --state data/raw)
          [ -n "$MONTH" ] && args+=(--month "$MONTH")
          echo "running: twrev.cli refresh ${args[*]}"
          python -m twrev.cli refresh "${args[@]}"

      # Everything the dashboard reads, written as files. The bucket heatmap is
      # computed HERE, by the same statement that used to run on D1, out of
      # ingest/src/twrev/sql/heatmap_bucket.sql - so the aggregation still
      # happens in SQLite, just at publish time instead of per request.
      - name: Publish the dashboard's data
        env:
          PYTHONPATH: ingest/src
        run: |
          python -m twrev.cli export --db data/pipeline.sqlite --out web/public/data
          echo "--- published ---"
          ls -la web/public/data web/public/data/company | head -20

      # Offline gates, before anything is committed. `validate` re-reads every
      # hand-edited YAML and asserts the generated TypeScript is current; the
      # test suite covers the exporters that just produced these files.
      - name: Check the published data against the suite
        env:
          PYTHONPATH: ingest/src
        run: |
          python -m twrev.cli validate
          python -m pytest ingest/tests -q

      # A month's refresh is a reviewable diff now, not an opaque write to a
      # service nobody can see into. If nothing changed - the ordinary case for
      # the 14th and 18th passes when no straggler filed - there is nothing to
      # commit and nothing to deploy.
      - name: Commit the state and the published data
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw web/public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change - nothing to publish"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --cached --stat
          git commit -m "data: refresh ${MONTH:-latest} (run ${{ github.run_id }})"
          git push
        env:
          MONTH: ${{ github.event.inputs.month }}

      # Publishing is a separate job with a separate credential. Static assets
      # only ship inside a `wrangler deploy`, so the data cannot reach a reader
      # without one - but the scrape does not need to hold the token that does
      # it. deploy.yml builds, deploys, and then asserts the served bundle is
      # the one it just built.
      - name: Ask deploy.yml to publish
        if: ${{ github.event.inputs.dry_run != 'true' && steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --ref "${{ github.ref_name }}"
          echo "deploy dispatched; it will verify the served bundle itself"

      # When a run fails, the store it built is the only evidence of why. The
      # JSONL state is in git on success and deliberately NOT committed on
      # failure, so this is the only way to see what a failed run produced.
      - name: Upload the store and the published files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-${{ github.run_id }}
          path: |
            data/pipeline.sqlite
            data/raw
            web/public/data
          retention-days: 30
          if-no-files-found: warn
